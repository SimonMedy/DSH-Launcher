name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/DSHLauncher.Tests/DSHLauncher.Tests.csproj

      - name: Build
        run: dotnet build tests/DSHLauncher.Tests/DSHLauncher.Tests.csproj -c Release --no-restore

      - name: Test security and config invariants
        run: dotnet test tests/DSHLauncher.Tests/DSHLauncher.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish launcher
        run: dotnet publish src/DSHLauncher/DSHLauncher.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/publish

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: '**/TestResults/**'
          retention-days: 5

  codeql:
    name: CodeQL
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build src/DSHLauncher/DSHLauncher.csproj -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
